<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مراجعة التقارير</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Tahoma, Arial, sans-serif;
      background: #f6f3ef;
      color: #333;
    }

    header {
      background: #6b2337;
      color: white;
      padding: 22px 30px;
    }

    header h1 {
      margin: 0 0 6px;
      font-size: 24px;
    }

    header p {
      margin: 0;
      opacity: .9;
    }

    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 18px;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
    }

    .refresh {
      background: #6b2337;
      color: white;
    }

    .logout {
      background: #ddd;
      color: #333;
    }

    .status {
      background: white;
      border-radius: 14px;
      padding: 16px 20px;
      margin-bottom: 18px;
      box-shadow: 0 3px 12px rgba(0,0,0,.06);
    }

    .reports {
      display: grid;
      gap: 16px;
    }

    .report-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 3px 14px rgba(0,0,0,.07);
    }

    .report-card h2 {
      margin-top: 0;
      color: #6b2337;
      font-size: 20px;
    }

    .info {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }

    .info div {
      background: #f8f6f3;
      padding: 12px;
      border-radius: 10px;
    }

    .label {
      color: #777;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .value {
      font-weight: bold;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .open {
      background: #6b2337;
      color: white;
    }

    .approve {
      background: #2e7d32;
      color: white;
    }

    .return {
      background: #c78a00;
      color: white;
    }

    .empty {
      background: white;
      padding: 35px;
      text-align: center;
      border-radius: 15px;
      color: #777;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 850px;
      margin: 30px auto;
      border-radius: 18px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .close {
      background: #eee;
      color: #333;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      margin-top: 10px;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      font-family: inherit;
      resize: vertical;
    }

    .section {
      border-top: 1px solid #eee;
      padding: 15px 0;
    }

    .section h3 {
      color: #6b2337;
      margin-top: 0;
    }

    pre {
      white-space: pre-wrap;
      word-break: break-word;
      background: #f7f5f2;
      padding: 12px;
      border-radius: 10px;
      font-family: inherit;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: #777;
    }

    @media (max-width: 600px) {
      header {
        padding: 18px;
      }

      .container {
        margin-top: 20px;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>مراجعة التقارير</h1>
  <p id="reviewerName">جاري التحقق من المستخدم...</p>
</header>

<div class="container">

  <div class="toolbar">
    <button class="refresh" id="refreshBtn">تحديث التقارير</button>
    <button class="logout" id="logoutBtn">تسجيل الخروج</button>
  </div>

  <div class="status" id="statusBox">
    جاري تحميل التقارير...
  </div>

  <div id="reportsContainer" class="reports">
    <div class="loading">جاري تحميل التقارير...</div>
  </div>

</div>

<!-- نافذة عرض التقرير -->
<div class="modal" id="reportModal">

  <div class="modal-content">

    <div class="modal-header">
      <h2 id="modalTitle">التقرير</h2>
      <button class="close" id="closeModal">إغلاق</button>
    </div>

    <div id="reportDetails"></div>

    <div class="section">
      <h3>ملاحظات المراجع</h3>

      <textarea
        id="reviewNotes"
        placeholder="اكتبي ملاحظات المراجعة هنا..."
      ></textarea>
    </div>

    <div class="actions">

      <button class="approve" id="approveBtn">
        اعتماد التقرير
      </button>

      <button class="return" id="returnBtn">
        إعادة للتعديل
      </button>

    </div>

  </div>

</div>

<script type="module">

  import { db } from "../js/firebase/config.js";

  import {
    collection,
    query,
    where,
    getDocs,
    doc,
    updateDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  import {
    requireAuth,
    logout
  } from "../js/auth.js";

  let reviewerProfile = null;
  let selectedReport = null;

  const reportsContainer =
    document.getElementById("reportsContainer");

  const statusBox =
    document.getElementById("statusBox");

  const reviewerName =
    document.getElementById("reviewerName");

  const modal =
    document.getElementById("reportModal");

  const reportDetails =
    document.getElementById("reportDetails");

  const reviewNotes =
    document.getElementById("reviewNotes");

  const modalTitle =
    document.getElementById("modalTitle");


  // حماية الصفحة
  requireAuth(async (profile) => {

    reviewerProfile = profile;

    reviewerName.textContent =
      `${profile.name || "المراجع"} — مراجعة التقارير`;

    await loadReports();

  });


  // تحميل التقارير المحالة للمراجع
  async function loadReports() {

    reportsContainer.innerHTML =
      `<div class="loading">جاري تحميل التقارير...</div>`;

    statusBox.textContent =
      "جاري البحث عن التقارير...";

    try {

      /*
       * نبحث عن التقارير التي حالتها:
       * submitted
       *
       * ويمكن لاحقًا ربطها بمعرّف المراجع
       * إذا أضفنا reviewerUid.
       */

      const q = query(
        collection(db, "reports"),
        where("status", "==", "submitted")
      );

      const snapshot = await getDocs(q);

      if (snapshot.empty) {

        reportsContainer.innerHTML = `
          <div class="empty">
            لا توجد تقارير بانتظار المراجعة حاليًا.
          </div>
        `;

        statusBox.textContent =
          "عدد التقارير بانتظار المراجعة: 0";

        return;
      }

      const reports = snapshot.docs.map(docSnap => ({
        id: docSnap.id,
        ...docSnap.data()
      }));

      statusBox.textContent =
        `عدد التقارير بانتظار المراجعة: ${reports.length}`;

      reportsContainer.innerHTML = "";

      reports.forEach(report => {

        const card =
          document.createElement("div");

        card.className = "report-card";

        const basic =
          report.basicData || {};

        const ownerName =
          report.ownerName ||
          basic.departmentName ||
          "غير محدد";

        const reportTitle =
          basic.reportTitle ||
          basic.title ||
          "تقرير أداء";

        card.innerHTML = `

          <h2>${escapeHtml(reportTitle)}</h2>

          <div class="info">

            <div>
              <div class="label">الجهة / القسم</div>
              <div class="value">
                ${escapeHtml(ownerName)}
              </div>
            </div>

            <div>
              <div class="label">حالة التقرير</div>
              <div class="value">
                بانتظار المراجعة
              </div>
            </div>

            <div>
              <div class="label">رقم التقرير</div>
              <div class="value">
                ${escapeHtml(report.id)}
              </div>
            </div>

          </div>

          <div class="actions">

            <button
              class="open"
              data-open="${report.id}">
              فتح التقرير
            </button>

            <button
              class="approve"
              data-approve="${report.id}">
              اعتماد
            </button>

            <button
              class="return"
              data-return="${report.id}">
              إعادة للتعديل
            </button>

          </div>
        `;

        reportsContainer.appendChild(card);

      });

      document
        .querySelectorAll("[data-open]")
        .forEach(button => {

          button.addEventListener("click", () => {

            const id =
              button.dataset.open;

            const report =
              reports.find(r => r.id === id);

            openReport(report);

          });

        });


      document
        .querySelectorAll("[data-approve]")
        .forEach(button => {

          button.addEventListener("click", async () => {

            const id =
              button.dataset.approve;

            await approveReport(id);

          });

        });


      document
        .querySelectorAll("[data-return]")
        .forEach(button => {

          button.addEventListener("click", () => {

            const id =
              button.dataset.return;

            const report =
              reports.find(r => r.id === id);

            openReport(report);

          });

        });

    } catch (error) {

      console.error(error);

      reportsContainer.innerHTML = `
        <div class="empty">
          حدث خطأ أثناء تحميل التقارير.
          <br>
          ${escapeHtml(error.message)}
        </div>
      `;

      statusBox.textContent =
        "تعذر تحميل التقارير.";

    }

  }


  // فتح التقرير
  function openReport(report) {

    if (!report) return;

    selectedReport = report;

    const basic =
      report.basicData || {};

    modalTitle.textContent =
      basic.reportTitle ||
      basic.title ||
      "التقرير";

    reviewNotes.value =
      report.reviewApproval?.reviewNotes || "";

    reportDetails.innerHTML = "";

    const ignoredFields = [
      "id",
      "ownerUid",
      "ownerName",
      "status",
      "createdAt",
      "updatedAt",
      "reviewApproval"
    ];

    Object.entries(report).forEach(([key, value]) => {

      if (ignoredFields.includes(key)) return;

      const section =
        document.createElement("div");

      section.className = "section";

      section.innerHTML = `
        <h3>${escapeHtml(formatKey(key))}</h3>
        <pre>${escapeHtml(
          formatValue(value)
        )}</pre>
      `;

      reportDetails.appendChild(section);

    });

    modal.style.display = "block";

  }


  // اعتماد التقرير
  async function approveReport(reportId) {

    const notes =
      reviewNotes.value.trim();

    const confirmed =
      confirm("هل أنتِ متأكدة من اعتماد التقرير؟");

    if (!confirmed) return;

    try {

      await updateDoc(
        doc(db, "reports", reportId),
        {
          status: "approved",

          reviewApproval: {
            reviewedByUid: reviewerProfile.uid,
            reviewedByName: reviewerProfile.name || "",
            reviewNotes: notes,
            decision: "approved",
            reviewedAt: serverTimestamp()
          },

          updatedAt: serverTimestamp()
        }
      );

      alert("تم اعتماد التقرير بنجاح.");

      closeModal();

      await loadReports();

    } catch (error) {

      console.error(error);

      alert(
        "تعذر اعتماد التقرير: " +
        error.message
      );

    }

  }


  // إعادة التقرير للتعديل
  async function returnReport() {

    if (!selectedReport) return;

    const notes =
      reviewNotes.value.trim();

    if (!notes) {

      alert(
        "اكتبي ملاحظات المراجع قبل إعادة التقرير للتعديل."
      );

      return;

    }

    const confirmed =
      confirm(
        "هل تريدين إعادة التقرير لصاحبته للتعديل؟"
      );

    if (!confirmed) return;

    try {

      await updateDoc(
        doc(db, "reports", selectedReport.id),
        {
          status: "returned",

          reviewApproval: {
            reviewedByUid: reviewerProfile.uid,
            reviewedByName: reviewerProfile.name || "",
            reviewNotes: notes,
            decision: "returned",
            reviewedAt: serverTimestamp()
          },

          updatedAt: serverTimestamp()
        }
      );

      alert("تمت إعادة التقرير للتعديل.");

      closeModal();

      await loadReports();

    } catch (error) {

      console.error(error);

      alert(
        "تعذر إعادة التقرير: " +
        error.message
      );

    }

  }


  function closeModal() {

    modal.style.display = "none";

    selectedReport = null;

    reviewNotes.value = "";

  }


  function formatKey(key) {

    const names = {

      basicData: "البيانات الأساسية",

      goals: "الأهداف والمستهدفات",

      indicators: "مؤشرات الأداء",

      programs: "الأعمال والبرامج",

      measurementTools: "أدوات القياس",

      resultsAnalysis: "تحليل النتائج",

      strengths: "نقاط القوة",

      difficulties: "الصعوبات والتحديات",

      improvementOpportunities:
        "فرص التحسين",

      initiatives: "المبادرات",

      impactStories: "قصص الأثر",

      recommendations: "التوصيات",

      nextPeriodPlan:
        "خطة الفترة القادمة",

      evidence: "الأدلة والمرفقات"

    };

    return names[key] || key;

  }


  function formatValue(value) {

    if (value === null ||
        value === undefined) {

      return "";

    }

    if (typeof value === "object") {

      try {

        return JSON.stringify(
          value,
          null,
          2
        );

      } catch {

        return String(value);

      }

    }

    return String(value);

  }


  function escapeHtml(value) {

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }


  document
    .getElementById("refreshBtn")
    .addEventListener(
      "click",
      loadReports
    );


  document
    .getElementById("logoutBtn")
    .addEventListener(
      "click",
      logout
    );


  document
    .getElementById("closeModal")
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById("approveBtn")
    .addEventListener(
      "click",
      async () => {

        if (!selectedReport) return;

        await approveReport(
          selectedReport.id
        );

      }
    );


  document
    .getElementById("returnBtn")
    .addEventListener(
      "click",
      returnReport
    );


  window.addEventListener(
    "click",
    event => {

      if (event.target === modal) {

        closeModal();

      }

    }
  );

</script>

</body>
</html>
